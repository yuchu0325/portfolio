<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>portfolio</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #141414;
      --pad: clamp(20px, 5vw, 60px); /* 增加了两边的留白 */
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 左上角 portfolio */
    .brand {
      position: fixed;
      top: var(--pad);
      left: var(--pad);
      z-index: 100;
      font-size: 16px;
      letter-spacing: 0.2em;
      font-weight: 600;
      text-transform: lowercase;
    }

    main {
      /* 👇 这里控制整体宽度，从 1600px 改成了 1100px，整体变小变精致 */
      max-width: 1100px; 
      margin: 0 auto;
      padding: clamp(80px, 10vw, 120px) var(--pad) var(--pad);
    }

    /* 两列网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(16px, 3vw, 32px); /* 增加了图片之间的间距 */
    }

    /* 图片容器：去掉了 16:9 强制比例 */
    .item {
      overflow: hidden;
      background: #f5f5f5; /* 图片加载前显示的底色 */
      border-radius: 4px; /* 可选：给图片加一点点微小的圆角，看着更柔和 */
    }

    /* 图片自适应：按原图比例显示 */
    .item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    /* 鼠标悬停微微放大 */
    .item:hover img {
      transform: scale(1.03);
    }

    /* 手机端调整 */
    @media (max-width: 700px) {
      /* 手机端变一列 */
      .grid { 
        grid-template-columns: 1fr; 
      }
      
      /* 手机端两边留出更大的白边，让图片看着不那么大 */
      main {
        padding-left: 24px;
        padding-right: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="brand">portfolio</div>

  <main>
    <div class="grid" id="gif-grid"></div>
  </main>

  <script>
    /* ==========================================
       你的 15 张图片清单
       ========================================== */
    const myImages = [
      "01.gif",
      "02.png",
      "03.png",
      "04.png",
      "05.png",
      "06.png",
      "07.gif",
      "08.gif",
      "09.gif",
      "10.png",
      "11.gif",
      "12.gif",
      "13.png",
      "14.png",
      "15.gif"
    ];

    let html = '';
    myImages.forEach(name => {
      html += `
        <div class="item">
          <img src="assets/${name}" alt="" loading="lazy" />
        </div>
      `;
    });
    
    document.getElementById('gif-grid').innerHTML = html;
  </script>

</body>
</html>
